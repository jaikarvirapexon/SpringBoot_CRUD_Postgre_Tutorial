version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: student-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: student
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-app
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/student
      DB_USERNAME: student
      DB_PASSWORD: student123
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
